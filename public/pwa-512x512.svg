<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322" />
      <stop offset="50%" stop-color="#181e36" />
      <stop offset="100%" stop-color="#241e48" />
    </linearGradient>
    <linearGradient id="calStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="starStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- iOS App Icon Solid Base Background (Apple expects opaque icons) -->
  <rect width="512" height="512" fill="url(#appBg)" />

  <!-- Subtle ambient inner glow circle -->
  <circle cx="256" cy="256" r="180" fill="#6366f1" fill-opacity="0.12" filter="blur(30px)" />
  <circle cx="360" cy="360" r="110" fill="#38bdf8" fill-opacity="0.15" filter="blur(25px)" />

  <!-- The user's exact vector scaled and centered (original is 24x24) -->
  <g transform="translate(86, 86) scale(14.166)" filter="url(#glow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
      <!-- Calendar Body -->
      <path stroke="url(#calStroke)" d="M16 2v4M8 2v4m13 8v-2c0-3.771 0-5.657-1.172-6.828S16.771 4 13 4h-2C7.229 4 5.343 4 4.172 5.172S3 8.229 3 12v2c0 3.771 0 5.657 1.172 6.828S7.229 22 11 22h1M3 10h18" />
      <!-- Star / Sparkle in lower right -->
      <path stroke="url(#starStroke)" fill="#38bdf8" fill-opacity="0.18" d="m18.105 15.506l.616 1.241a.76.76 0 0 0 .497.371l1.116.187c.714.12.882.642.367 1.157l-.867.875a.77.77 0 0 0-.183.64l.249 1.082c.196.858-.255 1.19-1.008.741l-1.046-.624a.75.75 0 0 0-.693 0l-1.047.624c-.749.448-1.204.113-1.008-.74l.249-1.084a.77.77 0 0 0-.182-.639l-.868-.875c-.51-.515-.346-1.037.368-1.157l1.116-.187a.76.76 0 0 0 .493-.37l.616-1.243c.336-.674.882-.674 1.215 0" />
    </g>
  </g>
</svg>